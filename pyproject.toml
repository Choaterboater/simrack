[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simrack"
version = "1.0.0"
description = "Sandbox front end for a vJunos + Mist lab on Proxmox"
requires-python = ">=3.11"
dependencies = []
readme = "README.md"

[project.scripts]
simrack = "simrack.__main__:main"

[tool.setuptools.packages.find]
include = ["simrack*"]
