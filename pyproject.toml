[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labfront"
version = "1.0.0"
description = "Sandbox front end for a vJunos + Mist lab on Proxmox"
requires-python = ">=3.11"
dependencies = []
readme = "README.md"

[project.scripts]
labfront = "labfront.__main__:main"

[tool.setuptools.packages.find]
include = ["labfront*"]
